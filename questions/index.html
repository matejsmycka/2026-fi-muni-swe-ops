<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Flashcards pro přípravu na státnice N‑SWE OPS na FI MUNI. 282 otázek z 10 témat.">
  <meta name="theme-color" content="#0b1220">
  <meta property="og:title" content="N-SWE OPS Flashcards">
  <meta property="og:description" content="Flashcards pro přípravu na státnice N‑SWE OPS – 282 otázek z 10 témat.">
  <meta property="og:type" content="website">
  <title>N-SWE OPS Flashcards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  Sidebar — Topic Filters & Marked Queue                           -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <nav id="sidebar" aria-label="Topic filters">

    <h2>SWE-OPS Topics</h2>

    <div class="sidebar-actions">
      <button id="btn-select-all" type="button" aria-label="Select all topics">All</button>
      <button id="btn-select-none" type="button" aria-label="Deselect all topics">None</button>
      <button id="btn-theme-toggle" type="button" aria-label="Toggle theme">🌞/🌙</button>
    </div>

    <!-- Common Core (SWE 1–5) -->
    <span class="topic-group-label">Common Core</span>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="0" checked>
      <span class="topic-badge swe">SWE1</span>
      <span class="topic-name">Code Quality</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="1" checked>
      <span class="topic-badge swe">SWE2</span>
      <span class="topic-name">Software Engineering</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="2" checked>
      <span class="topic-badge swe">SWE3</span>
      <span class="topic-name">Databases</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="3" checked>
      <span class="topic-badge swe">SWE4</span>
      <span class="topic-name">Computer Networks</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="4" checked>
      <span class="topic-badge swe">SWE5</span>
      <span class="topic-name">Distributed Systems</span>
    </label>

    <!-- OPS Specialization (OPS 1–5) -->
    <span class="topic-group-label">OPS Specialization</span>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="5" checked>
      <span class="topic-badge ops">OPS1</span>
      <span class="topic-name">Development &amp; Deployment</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="6" checked>
      <span class="topic-badge ops">OPS2</span>
      <span class="topic-name">Secure Infrastructure</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="7" checked>
      <span class="topic-badge ops">OPS3</span>
      <span class="topic-name">Cloud Computing</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="8" checked>
      <span class="topic-badge ops">OPS4</span>
      <span class="topic-name">Operating Systems</span>
    </label>

    <label class="topic-item">
      <input type="checkbox" class="topic-checkbox" data-topic-index="9" checked>
      <span class="topic-badge ops">OPS5</span>
      <span class="topic-name">NoSQL Databases</span>
    </label>

    <!-- Marked Questions Queue -->
    <section class="sidebar-panel" aria-label="Marked questions">
      <h3>Marked Queue</h3>
      <div class="queue-meta" id="markMeta">0 marked questions</div>
      <div class="mark-list" id="markList">
        <div class="mark-empty">Mark questions to build a review queue.</div>
      </div>
    </section>

  </nav>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  Main — Flashcard Area                                             -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <main id="main">

    <div class="stats" id="textStatus">Loading…</div>

    <div id="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div></div>
    </div>

    <!-- 3D Flip Card -->
    <div class="card-container">
      <article class="card" id="card" role="button" tabindex="0" aria-label="Flashcard – click or press Space to flip">
        <div class="card-front">
          <span id="question"></span>
        </div>
        <div class="card-back">
          <span id="answer"></span>
        </div>
      </article>
    </div>

    <div class="counter" id="counter" aria-live="polite"></div>

    <div class="controls-bar">
      <button id="btn-shuffle" type="button" aria-label="Shuffle questions">⟳ Shuffle</button>
      <button id="btn-mark" type="button" class="warn" aria-label="Mark question for review">✦ Mark</button>
      <button id="btn-review" type="button" class="primary" aria-label="Mark as reviewed">Reviewed ✓</button>
      <button id="btn-flip" type="button" aria-label="Flip card">↺ Flip</button>
      <button id="btn-prev" type="button" aria-label="Previous question">◀</button>
      <button id="btn-next" type="button" aria-label="Next question">▶</button>
    </div>

    <div class="hotkeys" aria-hidden="true">
      <kbd>→</kbd><kbd>↓</kbd> next
      <span class="hotkey-sep">|</span>
      <kbd>←</kbd><kbd>↑</kbd> prev
      <span class="hotkey-sep">|</span>
      <kbd>Space</kbd><kbd>F</kbd> flip
      <span class="hotkey-sep">|</span>
      <kbd>R</kbd> review
      <span class="hotkey-sep">|</span>
      <kbd>M</kbd> mark
      <span class="hotkey-sep">|</span>
      <kbd>S</kbd> shuffle
    </div>

  </main>

  <!-- Scripts: data first (generated by rebuild.py), then app logic -->
  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
